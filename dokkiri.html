<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DOKKIRI-APP</title>
    <style>
        body, html {
            margin: 0; padding: 0; 
            width: 100%; 
            height: 100dvh; 
            background-color: black; overflow: hidden;
            display: flex; 
            flex-direction: column; /* 要素を縦に並べる */
            justify-content: center; align-items: center;
            position: relative;
        }

        /* 見出しのデザイン */
        .title-text {
            color: white;
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 30px;
            z-index: 10000;
            text-shadow: 0 0 10px rgba(255,255,255,0.5);
        }

        /* 共通のボタンスタイル */
        .action-btn {
            padding: 20px 40px;
            font-size: 24px;
            font-weight: bold;
            color: white;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            z-index: 10000;
            transition: transform 0.1s;
        }
        .action-btn:active { transform: scale(0.9); }

        /* オレンジ色のスタートボタン（既存） */
        #start-btn {
            background-color: #FF8C00;
            box-shadow: 0 4px 20px rgba(255, 140, 0, 0.4);
            margin-bottom: 20px; /* 下のボタンとの隙間 */
        }

        /* 赤色の難関レベルボタン（新規） */
        #hard-btn {
            background-color: #E60000; /* 赤色 */
            box-shadow: 0 4px 20px rgba(230, 0, 0, 0.4);
        }

        /* 画像の共通設定 */
        .content {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100%; 
            height: 100%;
            object-fit: contain;
            display: none;
        }

        /* 1枚目：image_cfa072.jpg */
        #img1 { z-index: 1; }

        /* まぶた：中間層 */
        .eyelid {
            position: fixed; left: 0; width: 100%; height: 50.5%;
            background-color: black; z-index: 100;
            transition: transform 0.05s linear;
            pointer-events: none;
        }
        #eyelid-top { top: 0; transform: translateY(-100%); }
        #eyelid-bottom { bottom: 0; transform: translateY(100%); }
        body.closed #eyelid-top { transform: translateY(0); }
        body.closed #eyelid-bottom { transform: translateY(0); }

        /* 2枚目：既存のドッキリ画像 */
        #img2 { 
            z-index: 200; 
            opacity: 0; 
            transition: opacity 2s ease-in-out; 
            transform: translate(-50%, -50%) scale(2); 
        }

        /* 3枚目：鶏の画像（新規） */
        #img3 {
            z-index: 300; /* まぶた(100)の上に出すため高めに設定 */
            opacity: 0;
            transition: opacity 1.5s ease-in-out; /* 1.5秒かけてフェードイン */
            transform: translate(-50%, -50%); /* スケールは通常サイズ */
        }

        .fade-in { opacity: 1 !important; }
    </style>
</head>
<body>

    <div id="title" class="title-text">フラッシュ暗算バトル</div>

    <button id="start-btn" class="action-btn">タップでスタート</button>
    <button id="hard-btn" class="action-btn">難関レベルに挑戦</button>

    <img id="img1" class="content" src="image_cfa072.jpg">
    <img id="img2" class="content" src="image_cf4379.png">
    <img id="img3" class="content" src="image_chicken.png"> <audio id="soundEffect">
        <source src="sound-1221.mp3" type="audio/mpeg">
    </audio>
    <audio id="soundChicken">
        <source src="sound-chicken.mp3" type="audio/mpeg"> </audio>

    <div id="eyelid-top" class="eyelid"></div>
    <div id="eyelid-bottom" class="eyelid"></div>

    <script>
        const body = document.body;
        const title = document.getElementById('title');
        const startBtn = document.getElementById('start-btn');
        const hardBtn = document.getElementById('hard-btn');
        
        const img1 = document.getElementById('img1');
        const img2 = document.getElementById('img2');
        const img3 = document.getElementById('img3'); // 追加
        
        const sound = document.getElementById('soundEffect');
        const soundChicken = document.getElementById('soundChicken'); // 追加
        
        const wait = (ms) => new Promise(resolve => setTimeout(resolve, ms));

        // 共通の初期化（ボタンと見出しを消す）
        function hideUI() {
            title.style.display = 'none';
            startBtn.style.display = 'none';
            hardBtn.style.display = 'none';
        }

        // ==========================================
        // 【通常】オレンジボタンの挙動（既存・4回瞬き）
        // ==========================================
        async function startDokkiri() {
            hideUI();
            img1.style.display = 'block';
            img2.style.display = 'block';

            for (let i = 1; i <= 4; i++) {
                await wait(50); 
                body.classList.add('closed'); 
                await wait(70); 
                if (i < 4) {
                    body.classList.remove('closed');
                }
            }

            img1.style.display = 'none';
            sound.play().catch(e => console.error("Audio error:", e));
            img2.classList.add('fade-in');
        }

        // ==========================================
        // 【難関レベル】赤ボタンの挙動（新規・3回瞬き）
        // ==========================================
        async function startHardDokkiri() {
            hideUI();
            img1.style.display = 'block';
            img3.style.display = 'block'; // 鶏画像をブロック要素にする（まだ透明）

            // 3回だけ瞬き
            for (let i = 1; i <= 3; i++) {
                await wait(50); 
                body.classList.add('closed'); 
                await wait(70); 
                if (i < 3) {
                    body.classList.remove('closed');
                }
            }

            // 3回目でまぶたが閉じたまま、1枚目を消す
            img1.style.display = 'none';
            
            // 音声を再生（鶏の絶叫）
            soundChicken.play().catch(e => console.error("Audio error:", e));
            
            // 閉じたまぶた（黒画面）の上から、鶏を1.5秒かけてフェードイン
            img3.classList.add('fade-in');
        }

        // ボタンのクリックイベントを登録
        startBtn.onclick = () => startDokkiri();
        hardBtn.onclick = () => startHardDokkiri();
    </script>
</body>
</html>

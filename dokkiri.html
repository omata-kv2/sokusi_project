<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DOKKIRI-APP</title>
    <style>
        body, html {
            margin: 0; padding: 0; 
            width: 100%; 
            height: 100dvh; /* スマホのバーを考慮した高さ */
            background-color: black; overflow: hidden;
            display: flex; justify-content: center; align-items: center;
            position: relative;
        }
        /* オレンジ色のスタートボタン */
        #start-btn {
            padding: 20px 40px;
            font-size: 24px;
            font-weight: bold;
            color: white;
            background-color: #FF8C00;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            z-index: 10000;
            box-shadow: 0 4px 20px rgba(255, 140, 0, 0.4);
            transition: transform 0.1s;
        }
        #start-btn:active { transform: scale(0.9); }

        /* 画像の共通設定 */
        .content {
            position: absolute;
            /* 画面のちょうど真ん中に配置する呪文 */
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            
            width: 100%; 
            height: 100%;
            object-fit: contain; /* アスペクト比を維持 */
            display: none;
        }

        /* 1枚目：image_cfa072.jpg */
        #img1 { z-index: 1; }

        /* まぶた：中間層 */
        .eyelid {
            position: fixed; left: 0; width: 100%; height: 50.5%;
            background-color: black; z-index: 100;
            transition: transform 0.05s linear;
            pointer-events: none;
        }
        #eyelid-top { top: 0; transform: translateY(-100%); }
        #eyelid-bottom { bottom: 0; transform: translateY(100%); }
        body.closed #eyelid-top { transform: translateY(0); }
        body.closed #eyelid-bottom { transform: translateY(0); }

        /* 2枚目：最前面・2倍サイズ */
        #img2 { 
            z-index: 200; 
            opacity: 0; 
            transition: opacity 2s ease-in-out; 
            /* 真ん中寄せ(-50%)を維持しつつ、2倍に拡大する */
            transform: translate(-50%, -50%) scale(2); 
        }
        .fade-in { opacity: 1 !important; }
    </style>
</head>
<body>

    <button id="start-btn">タップでスタート</button>

    <img id="img1" class="content" src="image_cfa072.jpg">
    <img id="img2" class="content" src="image_cf4379.png">

    <audio id="soundEffect">
        <source src="sound-1221.mp3" type="audio/mpeg">
    </audio>

    <div id="eyelid-top" class="eyelid"></div>
    <div id="eyelid-bottom" class="eyelid"></div>

    <script>
        const body = document.body;
        const startBtn = document.getElementById('start-btn');
        const img1 = document.getElementById('img1');
        const img2 = document.getElementById('img2');
        const sound = document.getElementById('soundEffect');
        const wait = (ms) => new Promise(resolve => setTimeout(resolve, ms));

        async function startDokkiri() {
            startBtn.style.display = 'none';
            img1.style.display = 'block';
            img2.style.display = 'block';

            for (let i = 1; i <= 4; i++) {
                await wait(50); 
                body.classList.add('closed'); 
                await wait(70); 
                if (i < 4) {
                    body.classList.remove('closed');
                }
            }
            img1.style.display = 'none';
            sound.play().catch(e => console.error("Audio error:", e));
            img2.classList.add('fade-in');
        }

        startBtn.onclick = () => {
            startDokkiri();
        };
    </script>
</body>
</html>
